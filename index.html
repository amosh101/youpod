<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="A YouTube player dressed as a 3D iPod.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YouPod">
  <meta name="theme-color" content="#1b1f25">
  <title>YouPod</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="stage">
    <canvas id="gl" aria-label="Interactive 3D iPod click wheel"></canvas>

    <section id="lcd" aria-label="iPod display">
      <header class="hdr">
        <span class="ind" id="ind" aria-hidden="true"></span>
        <span class="ttl" id="ttl" aria-live="polite">YouPod</span>
        <span class="batt" aria-hidden="true"><i></i></span>
      </header>
      <div class="list" id="list"></div>
      <div class="vid" id="vid"><div id="yt"></div><div class="vnote" id="vnote" hidden></div></div>
      <section class="np" id="np" aria-label="Now playing" hidden>
        <div class="t1" id="t1">Not Playing</div>
        <div class="t2" id="t2"></div>
        <div class="bar" role="progressbar" aria-label="Playback progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><b id="fill"></b></div>
        <div class="times"><span id="tEl">0:00</span><span id="tRem">-0:00</span></div>
      </section>
      <section class="add" id="add" aria-label="Add a video" hidden>
        <p>Paste a YouTube link</p>
        <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="youtube.com/watch?v=..." aria-label="YouTube video URL">
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <div class="tip">Press the center button to paste and add</div>
      </section>
      <div class="vol" id="vol" aria-label="Volume" hidden><span>Vol</span><div class="tr"><b id="volFill"></b></div></div>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
